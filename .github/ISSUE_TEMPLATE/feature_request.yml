name: Feature request
description: Propose an improvement while preserving scientific reproducibility.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include unpublished sequences, AB1/ABI files, project files, or sensitive metadata.
  - type: textarea
    id: problem
    attributes:
      label: Problem or workflow need
      description: Explain the researcher-facing problem this would solve.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
    validations:
      required: true
  - type: textarea
    id: scientific-impact
    attributes:
      label: Scientific or reproducibility considerations
      description: Note any effects on sequence interpretation, provenance, or reproducibility.
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: context
    attributes:
      label: Additional context (optional)
